rtant;scroll-behavior:auto!important}}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<header class=\"header\">\n<a href=\"#home\" class=\"brand\" aria-label=\"Начало\">✉</a>\n<nav class=\"tabs\" aria-label=\"Этапы обучения\">\n<button data-page=\"home\" class=\"active\">Обзор</button><button data-page=\"diagnostic\">Входная задача</button><button data-page=\"learn\">Обучение</button><button data-page=\"practice\">Итоговая задача</button><button data-page=\"result\">Результат</button>\n</nav>\n<button class=\"help\" id=\"help-open\">Памятка ↗</button>\n</header>\n<div class=\"progress\" role=\"progressbar\" aria-label=\"Прогресс обучения\" aria-valuemin=\"0\" aria-valuemax=\"4\" aria-valuenow=\"0\"><span id=\"progress-fill\"></span></div>\n<main id=\"main\" tabindex=\"-1\"></main><div id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\"></div>\n<footer class=\"footer\">Задание 2 · Абдурахмонова Ю. Ф. · Учебные задания</footer>\n</div>\n<dialog id=\"help-dialog\"><div class=\"eyebrow\">Короткая памятка</div><h2>Как проверить письмо</h2><ol><li>Не переходите по ссылке из неожиданного письма и не вводите на ней данные карты, CVC или код из SMS.</li><li>Откройте знакомое приложение магазина или перевозчика самостоятельно.</li><li>Проверьте заказ и используйте контакты из приложения или заказа.</li><li>Срочность, логотип, сумма и HTTPS сами по себе не подтверждают подлинность письма.</li></ol><button class=\"button secondary\" data-close-help>Закрыть</button></dialog>\n<script>\n'use strict';\n// Перед передачей участникам замените адрес на ссылку для обратной связи.\nconst FEEDBACK_URL = 'https://t.me/yz_shine';\nconst $=s=>document.querySelector(s), main=$('#main');\nconst state={name:'',page:'home',diagnostic:null,firstDiagnostic:null,route:null,lessonStep:0,learned:false,final:null,attempts:0};\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst cases={\n entry:{subject:'Посылка не доставлена: уточните адрес',sender:'Посылка заданий · notice@parcel-address.example',text:'Адрес доставки указан неполностью. Чтобы получить посылку, доплатите 7 900 сумов на странице <code>mrifnoc/elpmaxe.sserdda-lecrap</code>. Укажите данные карты, CVC и код из SMS. На подтверждение 30 минут, иначе отправление вернётся продавцу.'},\n safe:{subject:'Срок доставки изменён',sender:'Служба «Посылка заданий»',text:'Доставка перенесена на завтра. Сведения доступны в приложении магазина или на знакомом вам сайте перевозчика. Вопросы можно задать через контакты из своего заказа.'},\n practice:{subject:'Нужна доплата за повторную доставку',sender:'Посылка заданий · service@parcel-fee.example',text:'Для повторной доставки внесите 9 000 сумов на <code>yap/elpmaxe.eef-lecrap</code>. На странице укажите данные карты и код из SMS. Оплатите за 15 минут, иначе посылку утилизируют.'},\n final:{subject:'Возврат платы за доставку',sender:'Посылка заданий · refund@delivery-refund.example',text:'Вам одобрен возврат 49 000 сумов за задержку доставки. Для зачисления откройте <code>drac/elpmaxe.dnufer-yreviled</code>, укажите номер карты, CVC и код из SMS. Заберите возврат за 20 минут, иначе он будет отменён.'}\n};\n\nconst shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};\nconst pool=[\n {id:'f1',fake:1,subject:'Посылка не доставлена: уточните адрес',sender:'Посылка заданий · notice@parcel-address.example',text:cases.entry.text,why:'Ссылка ведёт на непроверенный адрес, просят карту, CVC и код из SMS, на подтверждение дают 30 минут.'},\n {id:'f2',fake:1,sms:1,sender:'DOSTAVKA',text:'Таможенный сбор 12 500 сумов за ваш заказ. Оплатите сегодня: <code>yap/elpmaxe.rebos-smotsuc</code>, иначе посылка будет возвращена.',why:'Неожиданное требование оплаты по непроверенной ссылке и давление сроком.'},\n {id:'f3',fake:1,subject:'Курьер не нашёл вас',sender:'Служба доставки · help@courier-help.example',text:'Курьер не может найти адрес. Чтобы он приехал, отправьте в ответ код из SMS, который сейчас придёт на ваш номер. Ответьте в течение 10 минут.',why:'Ссылки нет, но просят код из SMS и торопят. Подделка не всегда содержит ссылку, а код подтверждения нельзя отправлять никому.'},\n {id:'f4',fake:1,subject:'Аккаунт будет заблокирован',sender:'Безопасность аккаунта · security@parcel-account.example',text:'Аккаунт перевозчика будет заблокирован через 24 часа. Войдите и подтвердите пароль: <code>nigol/elpmaxe.tnuocca-lecrap</code>',why:'Угроза блокировки, срок, непроверенная ссылка и просьба ввести пароль.'},\n {id:'l1',fake:0,sms:1,sender:'Магазин',text:'Заказ передан курьеру. Ожидайте доставку сегодня с 14:00 до 18:00. Статус заказа виден в приложении магазина.',why:'Время названо, но ничего не требуют: ни ссылки, ни данных, ни оплаты. Срок сам по себе не признак обмана.'},\n {id:'l2',fake:0,subject:cases.safe.subject,sender:cases.safe.sender,text:cases.safe.text,why:'Сообщение ничего не требует и отправляет проверять сведения в приложении или в контактах заказа.'},\n {id:'l3',fake:0,sms:1,sender:'Курьер',text:'Курьер приедет завтра. Оплата при получении: 85 000 сумов, наличными или картой курьеру. Данные карты в сообщении не нужны.',why:'Сумма названа, но платят курьеру при получении, а данные в сообщении не просят.'},\n {id:'l4',fake:0,subject:'Заказ готов к выдаче',sender:'Пункт выдачи · info@pickup-point.example',text:'Заказ ждёт вас в пункте выдачи, хранится 5 дней. Код получения указан в приложении магазина: назовите его сотруднику на месте.',why:'Код называют лично сотруднику, а не отправляют по ссылке или в ответ на сообщение.'}\n];\nconst finals=[\n {subject:'Возврат платы за доставку',sender:'Посылка заданий · refund@delivery-refund.example',text:'Вам одобрен возврат [[amount|49 000 сумов]] за задержку [[name|доставки]]. Для зачисления откройте [[link|drac/elpmaxe.dnufer-yreviled]], укажите [[code|номер карты, CVC и код из SMS]]. Заберите возврат [[pressure|за 20 минут, иначе он будет отменён]].'},\n {subject:'Возврат за повреждённую упаковку',sender:'Служба поддержки · claim@parcel-return.example',text:'[[name|Посылка заданий]] одобрила возврат [[amount|36 500 сумов]]. Чтобы получить деньги, перейдите на [[link|mialc/elpmaxe.nruter-lecrap]] и введите [[code|данные карты, CVC и код из SMS]]. Предложение действует [[pressure|только 15 минут, затем возврат аннулируется]].'}\n];\nconst newSet=()=>{let k=1+(Math.random()*3|0);return shuf([...shuf(pool.filter(m=>m.fake)).slice(0,k),...shuf(pool.filter(m=>!m.fake)).slice(0,4-k)]).map(m=>m.id)};\nconst actionOpts=old=>shuf([opt('radio','action','safe','Не открою ссылку и ничего не отправлю. Проверю заказ самостоятельно в знакомом приложении или на сайте',old),opt('radio','action','link','Открою ссылку и введу данные, если страница выглядит знакомо',old),opt('radio','action','reply','Отвечу на сообщение и уточню, правда ли это',old),opt('radio','action','https','Буду доверять сообщению, если адрес начинается с HTTPS',old)]).join('');\nfunction assessEntry(a){let ok=a.set.filter(id=>(a.v[id]==='fake')===!!pool.find(m=>m.id===id).fake).length,act=a.action==='safe'?1:0;return{score:ok+act,ok,act,ready:ok===4&&act===1}}\nfunction mail(k){let m=typeof k==='string'?cases[k]:k;if(m.sms)return `<article class=\"mail\"><div class=\"mail-meta\">SMS · ${esc(m.sender)}</div><p class=\"sms-b\">${m.text}</p></article>`;return `<article class=\"mail\"><div class=\"mail-head\"><span class=\"avatar\">✉</span><div>${esc(m.subject)}<small>${esc(m.sender)}</small></div></div><div class=\"mail-meta\">Кому: получатель<br>Учебный пример</div><p>${m.text}</p></article>`}\nfunction heading(k,t,d,tag=''){return `<div class=\"section-head\"><div><span class=\"eyebrow\">${k}</span><h2>${t}</h2><p>${d}</p></div>${tag?`<span class=\"tag\">${tag}</span>`:''}</div>`}\nfunction btn(label,cls='primary',id=''){return `<button type=\"button\" ${id?`id=\"${id}\"`:''} class=\"button ${cls}\">${label}</button>`}\nfunction opt(type,name,value,label,selected=[]){let checked=(Array.isArray(selected)?selected.includes(value):selected===value)?'checked':'';return `<label class=\"option\"><input type=\"${type}\" name=\"${name}\" value=\"${value}\" ${checked}><span>${label}</span></label>`}\nfunction assess(a){let chosen=new Set(a.flags||[]);let criteria=[a.verdict==='suspicious',chosen.has('link'),chosen.has('code'),chosen.has('pressure'),a.action==='safe'];let extras=[...chosen].filter(x=>!['link','code','pressure'].includes(x)).length;return {criteria,extras,score:Math.max(0,criteria.filter(Boolean).length-extras),ready:criteria.every(Boolean)&&extras===0}}\nfunction fileStamp(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`}\nfunction safeName(){return (state.name.normalize('NFC').trim().replace(/[^\\p{L}\\p{N}\\p{M} _-]/gu,'').replace(/\\s+/g,'_').slice(0,60)||'Участник')}\nfunction downloadSvg(stage){\n const a=stage==='entry'?state.firstDiagnostic:state.final;if(!a)return;\n const flagNames={link:'ссылка на непроверенный адрес',code:'запрос карты, CVC и кода из SMS',pressure:'срочность и угроза',name:'упоминание службы доставки',amount:'указана сумма денег'};\n const actionNames={safe:'не переходить по ссылке; проверить заказ через знакомое приложение или сайт',link:'открыть ссылку и ввести данные, если страница выглядит знакомо',https:'доверять сообщению из-за HTTPS',reply:'ответить и уточнить у отправителя'};\n const when=['Время сохранения',new Date().toLocaleString('ru-RU')];let rows;\n if(stage==='entry'){const q=assessEntry(a);rows=[['Имя или псевдоним',state.name],['Этап','Входная задача'],...a.set.map((id,i)=>['Сообщение '+(i+1),(a.v[id]==='fake'?'подозрительное':'похоже на настоящее')+((a.v[id]==='fake')===!!pool.find(m=>m.id===id).fake?' · верно':' · неверно')]),['Выбранное действие',actionNames[a.action]||'не указано'],['Объяснение',a.reason||'не заполнено'],['Баллы',`${q.score} из 5`],when]}\n else{const result=assess(a);rows=[['Имя или псевдоним',state.name],['Этап','Итоговая задача'],['Оценка письма',a.verdict==='suspicious'?'подозрительное':'можно выполнить просьбу'],['Отмеченные фрагменты',(a.flags||[]).map(x=>flagNames[x]).join('; ')||'нет'],['Выбранное действие',actionNames[a.action]||'не указано'],['Объяснение',a.reason||'не заполнено'],['Баллы',`${result.score} из 5`],['Маршрут',state.route==='independent'?'самостоятельный':'с поддержкой'],when]}\n const wrap=(text,max=78)=>{let lines=[];for(const part of String(text).split(/\\n/)){let line='';for(const word of part.split(/\\s+/)){if(line&&line.length+word.length+1>max){lines.push(line);line=word}else line+=(line?' ':'')+word}lines.push(line||' ')}return lines};\n let y=78,items=[];\n for(const [label,value] of rows){items.push(`<text x=\"54\" y=\"${y}\" font-size=\"16\" font-weight=\"700\">${esc(label)}</text>`);y+=25;for(const line of wrap(value)){items.push(`<text x=\"54\" y=\"${y}\" font-size=\"16\">${esc(line)}</text>`);y+=24}y+=14}\n const height=y+30;\n const svg=`<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1000\" height=\"${height}\" viewBox=\"0 0 1000 ${height}\"><title>Ответы участника ${esc(state.name)}</title><rect width=\"100%\" height=\"100%\" rx=\"28\" fill=\"#f6f6f6\"/><rect x=\"24\" y=\"24\" width=\"952\" height=\"${height-48}\" rx=\"20\" fill=\"white\"/><g font-family=\"Arial,sans-serif\" fill=\"#10251b\">${items.join('')}</g></svg>`;\n const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));const aTag=document.createElement('a');aTag.href=url;aTag.download=`${safeName()}_${stage==='entry'?'вход':'итог'}_${fileStamp()}.svg`;aTag.click();setTimeout(()=>URL.revokeObjectURL(url),10000)\n}\nfunction toast(t){let n=$('#toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3500)}\nfunction setPage(page){state.page=page;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let completed=state.final?4:state.diagnostic?2:0;$('#progress-fill').style.width=`${completed*25}%`;$('.progress').setAttribute('aria-valuenow',completed);render();window.scrollTo({top:0,behavior:'smooth'});}\nfunction render(){if(state.page==='home')home();else if(state.page==='diagnostic')diagnostic();else if(state.page==='learn')learn();else if(state.page==='practice')practice();else result();main.classList.remove('view');requestAnimationFrame(()=>main.classList.add('view'));}\nfunction takeName(){let n=$('#participant').value.trim();if(!n){toast('Введите код или псевдоним, чтобы продолжить.');$('#participant').focus();window.scrollTo({top:0,behavior:'smooth'});return false}state.name=n;return true}\nfunction pickRoute(r){if(!takeName())return;state.route=r;state.lessonStep=0;state.learned=false;setPage('learn')}\nfunction home(){main.innerHTML=`<section class=\"hero\"><div><span class=\"eyebrow\">Задание 2 · Учебный маршрут</span><h1>Распознавание<br><em>фишинговых</em> писем</h1><p class=\"lead\">Научитесь замечать подозрительные требования в письмах о доставке и проверять заказ через знакомый источник.</p><div class=\"meta\"><span class=\"chip\">10–15 минут</span><span class=\"chip\">Два маршрута</span><span class=\"chip\">Итоговая задача</span></div><label class=\"label\" for=\"participant\">Код или псевдоним</label><input class=\"text-input\" id=\"participant\" type=\"text\" autocomplete=\"off\" value=\"${esc(state.name)}\" placeholder=\"Например, Участник А\" maxlength=\"80\"><div class=\"button-row\">${btn('Начать с входной задачи ↗','primary','start-entry')}</div><p class=\"small muted\">Можно использовать псевдоним или код вместо имени.</p></div><div class=\"mail-art\"><div class=\"mail-card\"><div class=\"eyebrow\">Входящее письмо</div><h2>«Посылка не доставлена»</h2><div class=\"mail-head\"><span class=\"avatar\">✉</span><div>Посылка заданий<small>Требуется ваше действие</small></div></div><p>В первом задании решит function shuffle(items, rng=Math.random){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const getModule=id=>modules.find(m=>m.id===id);
const getCase=id=>modules.flatMap(m=>m.cases).find(c=>c.id===id);

function selectPracticeCases(module,shuffle){const first=module.cases.find(c=>c.id===(module.id==='telegram'?'tg-original-entry':module.id==='delivery'?'dl-original-entry':''));const last=module.cases.find(c=>c.id===(module.id==='telegram'?'tg-original-final':module.id==='delivery'?'dl-original-final':''));if(first&&last)return [first,...shuffle(module.cases.filter(c=>c!==first&&c!==last)).slice(0,4),last].map(c=>c.id);return shuffle(module.cases).slice(0,practiceLength).map(c=>c.id)}
function gradeChoice(c,choice,evidence=[]){const flags=c.evidence?.filter(x=>x[2]).map(x=>x[0]);return choice===c.correct&&(!flags||flags.length===evidence.length&&flags.every(f=>evidence.includes(f)))}

function home(){main.innerHTML=`<section class="hero course-hero"><div><span class="eyebrow">Короткий курс цифровой безопасности</span><h1>Распознавание<br><em>фишинговых сообщений</em></h1><p class="hero-motto">Прежде чем <span>доверять, <em>проверь.</em></span></p><p class="lead">Сообщение может выглядеть знакомым и убедительным. На этом курсе ты научишься замечать опасные просьбы и проверять их через независимый источник.</p><div class="meta"><span class="chip">5 модулей</span><span class="chip">Примеры и практика</span><span class="chip">В своём темпе</span></div><div class="button-row">${btn('Посмотреть карту курса','course-map')}${btn('Перейти к модулям','modules','secondary')}</div></div><div class="mail-art course-art"><span class="art-label">Входящее сообщение</span><article class="mail-card"><div class="mail-head"><span class="avatar">@</span><div>Служба доставки<small>Требуется ваше действие</small></div></div><h2>«Посылка не доставлена»</h2><p>Подтвердите адрес и данные карты.<br>Иначе заказ будет отменён.</p><div class="message-footer"><span class="message-dot"></span>Знакомая ситуация. Неочевидная просьба.</div></article><div class="art-question"><b>Что проверить первым?</b><span>Отправителя, требование или ссылку?</span></div></div></section>
<section class="course-section" id="intro">${head('Введение','О чём этот курс','Фишинговое сообщение пытается убедить человека раскрыть данные, предоставить доступ или выполнить опасное действие.')}<div class="intro-copy"><p>Такие сообщения встречаются в мессенджерах, электронной почте, SMS и чатах объявлений. Они могут ссылаться на настоящий заказ, приходить со знакомого аккаунта или обещать помощь.</p><p>Курс подойдёт тем, кто хочет увереннее разбирать повседневные сообщения. Ты будешь принимать решения в роли владельца аккаунта, покупателя, клиента банка и участника учебной группы.</p></div></section>
<section class="course-section" id="goals">${head('Цели','Что ты сможешь после курса','Результат проверяется на новых учебных ситуациях, а не по запоминанию названий.')}<div class="goals-grid">${['Находить подозрительную просьбу, даже если имя отправителя знакомо.','Различать опасное требование и обычное уведомление.','Выбирать способ проверки, который не зависит от сообщения.','Объяснять решение конкретными деталями, а не только общим впечатлением.'].map((t,i)=>`<article class="goal-item"><span>0${i+1}</span><p>${t}</p></article>`).join('')}</div></section>
<section class="course-section" id="course-map">${head('Карта курса','Из чего состоит обучение','Можно сначала познакомиться с материалами, затем войти и перейти к своим заданиям.')}<div class="course-map-grid">${[['Введение','О чём курс и зачем он тебе','anchor:intro','01'],['Цели','Что получится делать после курса','anchor:goals','02'],['Карта курса','Порядок работы и навигация','about','03'],['Модули','Теория небольшими разделами','modules','04'],['Примеры','Разбор сообщений из разных ситуаций','examples','05'],['Практика','Твоя роль, действие и объяснение','practice-hub','06'],['Тесты','Проверка с обратной связью','test-hub','07'],['Глоссарий','Понятные объяснения терминов','glossary','08']].map(([title,desc,action,n])=>`<button class="map-card" data-action="${action}"><div class="map-card-title"><span class="map-number">${n}</span><h3>${title}</h3></div><p>${desc}</p></button>`).join('')}</div></section>
<section class="course-section" id="course-modules">${head('Темы курса','Пять областей, одно умение','В каждом модуле есть короткая теория, разобранный пример, практика и итоговая проверка.')}${cards()}</section><section class="course-cta"><div><span class="eyebrow">Готова попробовать?</span><h2>Теперь твоё решение.</h2><p>Войди, чтобы перейти к практике и сохранять результаты. Материалы курса доступны для знакомства без регистрации.</p></div><div class="button-row">${btn(user?'Продолжить обучение':'Войти и начать',user?'modules':'login')}${!user?btn('Сначала посмотреть','modules','secondary'):''}</div></section>`}
const moduleIcons=[
'<path d="m3 10 18-7-7 18-3-7-8-4Z"/><path d="m11 14 5-6"/>',
'<path d="m3 7 9-4 9 4v11l-9 4-9-4V7Z"/><path d="m3 7 9 4 9-4M12 11v11M7 5l10 4"/>',
'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
'<path d="M12 5c-4-3-7-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-5-2-9 1ZM12 5v15"/>',
'<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v3h4v-3"/>'
].map(paths=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`);
function cards(){return `<div class="catalog">${modules.map((m,i)=>`<article class="panel module-card"><div class="module-card-heading"><div class="module-icon" aria-hidden="true">${moduleIcons[i]}</div><div><span class="eyebrow">${m.level}</span><h3>${m.title}</h3></div></div><p class="muted">${m.summary}</p><div class="module-card-bottom"><span class="small">${practiceLength} ситуаций<br>15-20 минут</span>${btn('Открыть модуль','module:'+m.id,'secondary')}</div></article>`).join('')}</div>`}
function catalog(){main.innerHTML=head('Учебные маршруты','Выбери свою ситуацию','Первая задача помогает выбрать объём поддержки. Итоговая задача общая для обоих маршрутов.')+cards()+`<section class="original-banner"><div><b>Дополнительная практика о доставке</b><p>Сохранён исходный разбор доставки, маршруты и выгрузка SVG.</p></div>${btn('Открыть исходный модуль','original','secondary')}</section>`}
function start(id){if(!user){pendingModule=id;navigate('login');return}const m=getModule(id);run={id:uuid(),module:id,step:0,phase:'question',route:null,answers:[],caseIds:selectPracticeCases(m,shuffle),order:[],startedAt:new Date().toISOString(),helpCount:0};run.order=shuffle(getCase(run.caseIds[0]).options);location.hash='play';render()}
function messageMarkup(c,m){const mark=text=>{let html=esc(text);for(const [id,label] of c.evidence||[])for(const part of label.split(' · ')){const pattern=part.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');html=html.replace(new RegExp(pattern,'gi'),match=>`<button type="button" class="frag" data-evidence="${id}" aria-pressed="false">${match}</button>`)}return html};return `<article class="case-message ${m.id==='telegram'?'telegram-message':m.id==='delivery'?'delivery-message':''}"><div class="message-app-label">${m.id==='telegram'?'Telegram':m.id==='delivery'?'Входящее письмо':'Учебное сообщение'}</div><div class="role-label">${mark(c.from)}</div><p class="scenario-message">${mark(c.message)}</p>${c.messages?`<div class="compare message-comparison">${c.messages.map(msg=>`<article class="mail"><b>${esc(msg.label)}</b><p>${esc(msg.text)}</p></article>`).join('')}</div>`:''}</article>${c.evidence?'<p class="note">Нажимай на выделенные фрагменты, которые повлияли на решение. Повторное нажатие снимает отметку. Отмечать всё подряд не нужно.</p>':''}`}
function play(){const m=getModule(run.module),c=getCase(run.caseIds[run.step]),total=run.caseIds.length;const stage=run.step===0?'Входная ситуация':run.step>=total-2?'Итоговая проверка':'Тренировка';main.innerHTML=head(`${stage} · ${run.step+1} из ${total}`,m.title,`Твоя роль - ${m.role.toLowerCase()}. Прочитай сообщение, выбери действие и объясни решение.`)+`<div class="case-progress" aria-label="Ситуация ${run.step+1} из ${total}">${run.caseIds.map((_,i)=>`<span class="${i<=run.step?'done':''}"></span>`).join('')}</div>`;
if(run.phase==='route'){main.innerHTML+=`<div class="note">По первому ответу ${run.answers[0].correct?'рекомендуется самостоятельный маршрут.':'рекомендуется маршрут с поддержкой.'} Можно выбрать другой путь. Письменное объяснение сохраняется для преподавателя.</div><div class="routes"><section class="route ${!run.answers[0].correct?'recommended':''}"><span class="eyebrow">Больше пояснений</span><h3>С поддержкой</h3><p>Сначала памятка по теме. Затем три тренировочных задания с подсказками и две итоговые ситуации.</p>${btn('Выбрать поддержку','route:support')}</section><section class="route ${run.answers[0].correct?'recommended':''}"><span class="eyebrow">Сначала своё решение</span><h3>Самостоятельно</h3><p>Те же три тренировочных и две итоговые ситуации. Начни со своего рассуждения и обратись к памятке при необходимости.</p>${btn('Проверить себя','route:independent')}</section></div>`;return}
if(run.phase==='material'){main.innerHTML+=`<section class="panel"><h3>Перед тренировкой</h3>${m.tips.map(t=>`<p>${esc(t)}</p>`).join('')}${btn('Перейти к тренировке','material-next')}</section>`;return}
const attempts=run.answers.filter(x=>x.caseId===c.id),last=attempts.at(-1),reviewed=run.phase==='feedback';const canRetry=run.step<total-2&&!last?.correct&&attempts.length<3;
main.innerHTML+=`<div class="grid practice-grid"><section>${messageMarkup(c,m)}${run.route==='support'?`<details class="panel compact-hint"><summary>Памятка по теме</summary>${m.tips.map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`:''}</section><section class="panel"><form id="case-form"><fieldset ${reviewed?'disabled':''}><legend>${esc(c.question)}</legend>${run.order.map(([id,text])=>`<label class="option"><input required type="radio" name="choice" value="${id}" ${last?.choice===id?'checked':''}><span>${esc(text)}</span></label>`).join('')}</fieldset><label class="label" for="reason">Объясни свой выбор</label><textarea id="reason" name="reason" required minlength="10" maxlength="1200" ${reviewed?'disabled':''} placeholder="Назови конкретные признаки и способ независимой проверки.">${esc(last?.reason||'')}</textarea><p class="small muted">Первый ответ сохраняется отдельно от повторных попыток. Объяснение проверяет преподаватель.</p>${reviewed?'':`<button class="button action-button" type="submit">Сохранить ответ ${forwardIcon}</button>`}</form>${reviewed?`<div class="feedback ${last.correct?'':'error'}"><h3>${last.correct?(c.evidence?'Действие и отметки проверены':'Действие выбрано верно'):'Проверь своё решение'}</h3><p>${esc(last.correct?c.explanation:c.hint)}</p>${!last.correct&&!canRetry?`<p>${esc(c.explanation)}</p>`:''}<div class="button-row">${canRetry?btn('Повторить попытку','retry'):''}${btn(run.step===0?'Выбрать маршрут':run.step===total-1?'Посмотреть результат':run.step===total-3?'К итоговой проверке':'Следующая ситуация','next')}</div></div>`:''}<div class="button-row">${btn('Спросить Zico','zico','secondary')}</div></section></div>`;
const flagButtons=[...document.querySelectorAll('[data-evidence]')];const selected=new Set(last?.evidence||[]);function syncFlags(){for(const b of flagButtons){b.setAttribute('aria-pressed',String(selected.has(b.dataset.evidence)));b.disabled=reviewed}}syncFlags();for(const b of flagButtons)b.onclick=()=>{const id=b.dataset.evidence;selected.has(id)?selected.delete(id):selected.add(id);syncFlags()};
if(!reviewed)$('#case-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),reason=f.get('reason').trim(),evidence=[...selected];if(reason.length<10){toast('Добавь короткое объяснение своими словами.');return}if(c.evidence&&!evidence.length){toast('Отметь в сообщении фрагмент, который повлиял на решение.');return}run.answers.push({caseId:c.id,choice:f.get('choice'),reason,evidence,correct:gradeChoice(c,f.get('choice'),evidence),attempt:attempts.length+1,at:new Date().toISOString()});run.phase='feedback';render()}}
async function finish(){const result={...run,complete:true,finishedAt:new Date().toISOString(),questionCount:run.caseIds.length,firstScore:run.caseIds.filter(id=>run.answers.find(a=>a.caseId===id)?.correct).length,finalCorrect:run.answers.filter(a=>a.caseId===run.caseIds.at(-1)).at(-1)?.correct,chatCount:run.helpCount};delete result.order;localResults.unshift(result);write(resultKey(),localResults);run=null;if(!demo){try{const saved=await api('results',{result});Object.assign(result,saved.result,{synced:true});write(resultKey(),localResults)}catch{toast('Результат сохранён в браузере. Отправка на сервер пока не удалась.')}}location.hash='progress';render()}

function progress(){const completed=localResults.filter(x=>x.complete);main.innerHTML=head('Личный кабинет','Мои результаты','Здесь разделены первые ответы, повторные попытки и обращения за помощью. Письменные объяснения требуют проверки преподавателем.')+`<div class="stats-grid"><section class="panel"><strong>${new Set(completed.map(x=>x.module)).size}</strong><span class="muted">модулей пройдено</span></section><section class="panel"><strong>${completed.length}</strong><span class="muted">завершённых прохождений</span></section><section class="panel"><strong>${completed.reduce((n,r)=>n+(r.chatCount||0),0)}</strong><span class="muted">обращений к помощнику в прохождениях</span></section></div><div class="button-row">${btn('Скачать мои ответы','export','secondary')}${!demo?btn('Обновить с сервера','sync','secondary'):''}</div><section class="panel table-scroll" style="margin-top:20px"><table><thead><tr><th>Модуль</th><th>Первые ответы</th><th>Повторные попытки</th><th>Сохранение</th><th>Подробности</th></tr></thead><tbody>${completed.map((r,i)=>`<tr><td>${esc(moduleTitle(r.module))}<br><small>${new Date(r.finishedAt).toLocaleString('ru-RU')}</small></td><td>${r.firstScore??'—'} / ${r.questionCount||r.caseIds?.length||3}</td><td>${Math.max(0,(r.answers?.length||0)-(r.questionCount||r.caseIds?.length||3))}</td><td>${r.synced?'Сервер и браузер':'Этот браузер'}</td><td><button class="link-button" data-action="detail:${i}">Ответы</button></td></tr>`).join('')||'<tr><td colspan="5">Пока нет завершённых разборов.</td></tr>'}</tbody></table></section><div id="result-detail"></div>${!demo?'<section class="panel" style="margin-top:20px"><h3>Общая статистика проекта</h3><p class="small muted">Доступна только владельцу с правами администратора.</p>'+btn('Показать статистику','admin','secondary')+'<div id="admin-stats"></div></section>':''}`}
function detail(i){const r=localResults.filter(x=>x.complete)[i];if(!r)return;$('#result-detail').innerHTML=`<section class="panel" style="margin-top:20px"><h3>${esc(moduleTitle(r.module))}</h3><p class="small muted">Маршрут - ${r.route==='support'?'с поддержкой':'самостоятельный'}</p>${(r.answers||[]).map(a=>`<div class="answer-review"><b>${esc(getCase(a.caseId)?.question||'Исходный модуль')}</b><p>${esc(getCase(a.caseId)?.options.find(o=>o[0]===a.choice)?.[1]||a.choice)}</p><p>${esc(a.reason)}</p>${a.evidence?.length?`<p class="small muted">Отмечены фрагменты: ${a.evidence.map(id=>esc(getCase(a.caseId)?.evidence?.find(e=>e[0]===id)?.[1]||id)).join('; ')}</p>`:''}<small>Попытка ${a.attempt} · ${a.correct?'действие верное':'действие требует пересмотра'}</small></div>`).join('')}<p class="small muted">Объяснения автоматически не оценивались.</p></section>`;$('#result-detail').scrollIntoView({behavior:'smooth'})}
function about(){main.innerHTML=head('Порядок работы','Не торопись выбирать','Учебный модуль помогает разбирать требования сообщения, а не угадывать по оформлению.')+`<div class="steps"><article class="step"><b>01 · Прими роль</b><span>Ты покупатель, владелец аккаунта или участник учебной группы. Учитывай, что уже известно в ситуации.</span></article><article class="step"><b>02 · Объясни действие</b><span>Назови основание своего решения. Адреса .example вымышлены, переходить по ним не нужно.</span></article><article class="step"><b>03 · Проверь и повтори</b><span>Первые ответы сохраняются отдельно. Повторная попытка помогает учиться, но не стирает первую ошибку.</span></article></div><section class="panel"><h3>Помощник Zico</h3><p>Круглая кнопка в правом нижнем углу открывает окно поверх страницы. Помощник должен уточнять затруднение и давать подсказку, не выдавая решение сразу.</p><p>Используй подсказку, чтобы ещё раз обдумать своё решение. Не отправляй настоящие пароли, коды, платёжные данные и сведения о других людях. Текст обращения передаётся внешнему сервису ИИ.</p><h3>Что сохраняется</h3><p>В режиме просмотра результаты остаются в этом браузере. После подключения базы данных аккаунт сохраняет выбранный маршрут, ответы, повторные попытки и число обращений к помощнику. Диалог хранится только в памяти открытой вкладки.</p><p>Проект не определяет реальную безопасность сайта и не проверяет адреса автоматически. Ситуации учебные.</p></section>`}
function original(){main.innerHTML=head('Дополнительный тренажёр','Доставка · разбор писем','Сохранены материалы, два маршрута, подсказки и скачивание SVG. Этот модуль учитывается отдельно от новых ролевых разборов.')+`<iframe title="Исходный учебный модуль о доставке" class="original-frame" id="original-preview"></iframe>`;document.getElementById('original-preview').srcdoc=ORIGINAL_SOURCE;}
function sectionHub(label,title,target){main.innerHTML=head(label,title,'Выбери тему, чтобы перейти к нужной части модуля.')+`<div class="catalog">${modules.map(m=>`<article class="panel module-card"><span class="eyebrow">${m.level}</span><h3>${m.title}</h3><p class="muted">${m.summary}</p>${btn('Открыть раздел','section:'+m.id+':'+target)}</article>`).join('')}</div>`}
function modulePage(id,tab='theory'){const m=getModule(id),lesson=lessons[id];if(!m||!lesson){catalog();return}const tabs=[['theory','Теория'],['examples','Примеры'],['practice','Практика'],['test','Тест']];if(!tabs.some(t=>t[0]===tab))tab='theory';currentModuleId=id;currentModuleTab=tab;main.innerHTML=head('Учебный модуль',m.title,m.summary)+`<div class="module-subnav module-tabs" role="tablist" aria-label="Разделы модуля">${tabs.map(([key,label])=>`<button role="tab" id="tab-${key}" aria-selected="${key===tab}" aria-controls="module-panel" tabindex="${key===tab?'0':'-1'}" data-action="tab:${id}:${key}">${label}</button>`).join('')}</div><section id="module-panel" role="tabpanel" aria-labelledby="tab-${tab}" tabindex="-1"></section>`;
const panel=$('#module-panel');if(tab==='theory'){panel.innerHTML=`<div class="module-tab-heading"><div><span class="eyebrow">${lesson.eyebrow}</span><h3>Разберёмся по шагам</h3></div>${btn('К примерам','tab:'+id+':examples','secondary')}</div><div class="theory-sections">${lesson.sections.map(([title,...paras],i)=>`<article class="panel theory-card"><div class="theory-number">0${i+1}</div><div><h3>${esc(title)}</h3>${paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div></article>`).join('')}</div>`}
else if(tab==='examples'){panel.innerHTML=`<div class="module-tab-heading"><div><span class="eyebrow">Примеры с объяснениями</span><h3>Сравни просьбы и способы проверки</h3></div>${btn('К практике','tab:'+id+':practice','secondary')}</div><div class="example-list">${lesson.exampleIds.map((caseId,i)=>{const c=getCase(caseId);return `<article class="example-card"><span class="eyebrow">Пример ${i+1}</span><div class="grid"><section>${messageMarkup({...c,evidence:undefined},m)}</section><section class="panel"><h3>Разбор</h3><p>${esc(c.explanation)}</p><p class="small muted">${esc(c.hint)}</p></section></div></article>`}).join('')}</div>`}
else if(tab==='practice'){panel.innerHTML=`<section class="panel practice-intro"><div class="module-tab-heading"><div><span class="eyebrow">Практическое прохождение</span><h3>Попробуй в своей роли</h3></div>${btn(user?'Начать практику':'Войти и перейти к практике','start:'+id)}</div><p>Твоя роль - ${m.role.toLowerCase()}. Пройди шесть ситуаций, выбери действие и объясни решение.</p><div class="steps"><article class="step"><b>1 · Входная ситуация</b><span>Начни со своего решения. Затем выбери маршрут с поддержкой или самостоятельный.</span></article><article class="step"><b>2 · Три тренировки</b><span>Сравнивай сообщения, отмечай детали и пробуй снова после подсказки.</span></article><article class="step"><b>3 · Две итоговые задачи</b><span>Примени правило к другим случаям. Первые ответы и объяснения сохраняются.</span></article></div>${id==='telegram'?'<p class="note">В модуле сохранены исходное уведомление об изменении двухэтапной проверки, сравнение сообщений А и Б и новая ситуация с ограничением в 15 минут.</p>':id==='delivery'?'<p class="note">В модуле сохранены письмо о доплате, сравнение двух писем и итоговый возврат платы. Подозрительные фрагменты отмечаются прямо в тексте.</p>':''}</section>${id==='delivery'?`<div class="original-banner"><div><b>Прежний тренажёр доставки</b><p>Отдельная версия из второй работы с входной проверкой четырёх уведомлений и сохранением SVG.</p></div>${btn('Открыть тренажёр','original','secondary')}</div>`:''}`}
else{const completed=localResults.find(r=>r.module===id&&r.complete);panel.innerHTML=`<section class="panel practice-intro"><div class="module-tab-heading"><div><span class="eyebrow">Итоговая проверка</span><h3>Проверь перенос правила</h3></div>${btn(user?'Начать прохождение':'Войти и перейти к практике','start:'+id)}</div><p>Две итоговые ситуации находятся в конце шестишагового прохождения. В них нужно самостоятельно выбрать действие, указать существенные детали и объяснить решение. Подсказка с разбором появляется после ответа.</p><p>Автоматически проверяются действие и отметки в сообщении, если они предусмотрены. Текстовое объяснение сохраняется для преподавателя и не получает автоматический балл.</p>${completed?`<div class="note">У тебя уже есть завершённое прохождение. Результат первого выбора ${completed.firstScore} из ${completed.questionCount||completed.caseIds?.length||3}.</div><div class="button-row">${btn('Открыть мои результаты','progress','secondary')}</div>`:'<p class="note">Сначала пройди входную ситуацию и тренировку. Отдельно пропустить их и получить итоговый результат нельзя.</p>'}</section>`}
const buttons=[...document.querySelectorAll('.module-tabs [role=tab]')];buttons.forEach((b,i)=>b.onkeydown=e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;const key=tabs[next][0];navigate('module/'+id+'/'+key);requestAnimationFrame(()=>document.getElementById('tab-'+key)?.focus({preventScroll:true}))}})}

function glossary(){const words=[['Фишинг','Попытка обманом получить данные, доступ к аккаунту или заставить выполнить опасное действие.'],['Отправитель','Человек или сервис, от имени которого пришло сообщение. Отображаемое имя само по себе не подтверждает личность.'],['Независимая проверка','Проверка через знакомое приложение, ранее известный сайт или контакт, без использования адресов из подозрительного сообщения.'],['Домен','Часть адреса, указывающая на сайт. Похожее написание не подтверждает принадлежность организации.'],['HTTPS','Защищённое соединение с сайтом. Само по себе не гарантирует, что сайт принадлежит нужной организации.'],['Код подтверждения','Одноразовый код для определённого действия, например входа или перевода. Его назначение нужно читать в уведомлении.'],['CVC','Код карты, который нельзя передавать собеседнику или вводить на странице из непроверенного сообщения.'],['Социальная инженерия','Воздействие на человека через доверие, страх, спешку или обещание выгоды, чтобы он выполнил нужное действие.'],['QR-код','Изображение, которое может содержать адрес страницы. Его форма не подтверждает безопасность перехода.'],['Двухэтапная проверка','Дополнительный способ защиты входа. Она не делает безопасной передачу кодов или паролей другому человеку.']];main.innerHTML=head('Словарь курса','Глоссарий','Термины, которые встречаются в примерах и заданиях.')+`<div class="glossary-grid">${words.map(([word,text])=>`<article class="panel"><h3>${word}</h3><p>${text}</p></article>`).join('')}</div>`}
function closeMenus(){document.querySelectorAll('.nav-dropdown').forEach(el=>{el.classList.remove('open');delete el.dataset.pinned;el.querySelector('button').setAttribute('aria-expanded','false')})}
$('#modules-menu').innerHTML=modules.map((m,i)=>`<button data-action="module:${m.id}"><span class="menu-number">0${i+1}</span><span><b>${m.title}</b><small>${m.level}</small></span></button>`).join('');
for(const id of ['modules','help']){const wrap=$('#'+id+'-dropdown'),toggle=$('#'+id+'-toggle');const show=()=>{wrap.classList.add('open');toggle.setAttribute('aria-expanded','true')};toggle.onclick=()=>{if(id==='modules'){closeMenus();navigate('modules');return}const pinned=wrap.dataset.pinned==='true';closeMenus();if(!pinned){show();wrap.dataset.pinned='true'}};wrap.onmouseenter=()=>{if(matchMedia('(hover: hover)').matches){closeMenus();show()}};toggle.onfocus=()=>{if(id==='modules')show()};wrap.onmouseleave=()=>{if(wrap.dataset.pinned!=='true'){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}};wrap.addEventListener('focusout',()=>setTimeout(()=>{if(!wrap.contains(document.activeElement)){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}},0))}
function updateTopNav(page){const key=page.startsWith('module/')||['modules','play','original','examples','practice-hub','test-hub'].includes(page)?'modules':page==='glossary'?'glossary':page==='home'?'home':'help';const target=key==='modules'?$('#modules-toggle'):key==='help'?$('#help-toggle'):document.querySelector('[data-nav="'+key+'"]');document.querySelectorAll('.tabs>button,.tabs>.nav-dropdown>button').forEach(b=>{const active=b===target;b.classList.toggle('active',active);active?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});const nav=document.querySelector('.tabs');let indicator=nav.querySelector('.nav-indicator');if(!indicator){indicator=document.createElement('span');indicator.className='nav-indicator';indicator.setAttribute('aria-hidden','true');nav.prepend(indicator)}if(target){const bounds=nav.getBoundingClientRect(),r=target.getBoundingClientRect();indicator.style.width=r.width+'px';indicator.style.height=r.height+'px';indicator.style.transform=`translate(${r.left-bounds.left-nav.clientLeft}px,${r.top-bounds.top-nav.clientTop}px)`}}
window.addEventListener('resize',()=>updateTopNav(location.hash.slice(1)||'home'));
document.addEventListener('click',e=>{if(!e.target.closest('.nav-dropdown'))closeMenus()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});
$('#to-top').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});window.addEventListener('scroll',()=>$('#to-top').classList.toggle('visible',window.scrollY>450),{passive:true});
function drawChat(){const log=$('#chat-log');log.replaceChildren();if(!chat.length)addBubble('Привет! Какое сообщение разберём?','assistant',false);for(const m of chat)addBubble(m.text,m.role,false);if(busy)addBubble('Обдумываю подсказку…','notice',false);log.scrollTop=log.scrollHeight}
function addBubble(text,role,save=true){if(save)chat.push({role,text,at:new Date().toISOString()});const el=document.createElement('div');el.className='chat-message '+role;el.textContent=text;$('#chat-log').append(el)}
function openChat(){$('#zico-panel').classList.remove('hidden');requestAnimationFrame(()=>$('#zico-panel').classList.add('is-open')); $('#zico-open').setAttribute('aria-expanded','true');drawChat();$('#chat-input').focus()}
let closeTimer;function closeChat(){$('#zico-panel').classList.remove('is-open');clearTimeout(closeTimer);closeTimer=setTimeout(()=>{if(!$('#zico-panel').classList.contains('is-open'))$('#zico-panel').classList.add('hidden')},180);$('#zico-open').setAttribute('aria-expanded','false');$('#zico-open').focus()}
$('#chat-form').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('#chat-input').value.trim();if(!text)return;busy=true;$('#chat-send').disabled=true;const history=chat.filter(x=>['user','assistant'].includes(x.role)).slice(-8);chat.push({role:'user',text,at:new Date().toISOString()});$('#chat-input').value='';drawChat();try{if(!user||demo)throw Error('Чтобы получить подсказку Zico, войди в аккаунт на подключённом сайте.');const d=await api('chat',{text,history,module:run?.module||null});chat.push({role:'assistant',text:d.text,at:new Date().toISOString()});savedChatCount++;if(run)run.helpCount++}catch(err){chat.push({role:'notice',text:err.message,at:new Date().toISOString()})}finally{busy=false;$('#chat-send').disabled=false;drawChat()}};
$('#zico-open').onclick=()=>$('#zico-open').getAttribute('aria-expanded')==='true'?closeChat():openChat();$('#zico-close').onclick=closeChat;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#zico-panel').classList.contains('hidden'))closeChat()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-nav]');if(!b)return;const action=b.dataset.action||b.dataset.nav;if(['home','modules','progress','about','original','glossary','login'].includes(action)){navigate(action);return}if(action.startsWith('section:')){const [,id,target]=action.split(':');navigate('module/'+id+'/'+({'example':'examples','module-practice':'practice','module-test':'test'}[target]||'theory'));return}if(action.startsWith('tab:')){const [,id,tab]=action.split(':');navigate('module/'+id+'/'+tab);return}if(action.startsWith('module:')){navigate('module/'+action.split(':')[1]);return}if(action.startsWith('anchor:')){document.getElementById(action.split(':')[1])?.scrollIntoView({behavior:'smooth'});return}if(action==='course-map'){document.getElementById('course-map')?.scrollIntoView({behavior:'smooth'});return}if(['examples','practice-hub','test-hub'].includes(action)){navigate(action);return}if(action.startsWith('start:')){if(run&&!confirm('Начать заново?'))return;start(action.split(':')[1]);return}if(action==='demo'){demo=true;user={id:'demo',username:'Просмотр'};enterCourse()}else if(action==='zico')openChat();else if(action.startsWith('route:')){run.route=action.split(':')[1];run.step=1;run.phase=run.route==='support'?'material':'question';run.order=shuffle(getCase(run.caseIds[1]).options);render()}else if(action==='material-next'){run.phase='question';render()}else if(action==='retry'){if(run.answers.length>=60){toast('Слишком много повторных попыток. Начни новый разбор.');return}run.phase='question';run.order=shuffle(getCase(run.caseIds[run.step]).options);render()}else if(action==='next'){if(run.step===0){run.phase='route';render()}else if(run.step===run.caseIds.length-1){await finish()}else{run.step++;run.phase='question';run.order=shuffle(getCase(run.caseIds[run.step]).options);render()}}else if(action==='export')download('Zico-results.json',{user:demo?'demo':user.username,results:localResults,chatCalls:savedChatCount});else if(action.startsWith('detail:'))detail(Number(action.split(':')[1]));else if(action==='sync'){try{for(const pending of localResults.filter(r=>!r.synced)){const saved=await api('results',{result:pending});Object.assign(pending,saved.result,{synced:true});}const d=await api('results');const map=new Map(localResults.map(r=>[r.id,r]));for(const r of d.results)map.set(r.id,{...r,synced:true});localResults=[...map.values()].sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt));write(resultKey(),localResults);render()}catch(err){toast(err.message)}}else if(action==='admin'){try{const d=await api('admin');$('#admin-stats').textContent=`Аккаунтов ${d.users}. Завершённых прохождений ${d.runs}. Обращений к ИИ ${d.chatCalls}. Уникальных участников с результатами ${d.activeUsers}.`}catch(err){$('#admin-stats').textContent=err.message}}});
document.querySelector('.brand').onclick=e=>{e.preventDefault();navigate('home')};$('#account').onclick=async()=>{if(!user){navigate('login');return}if(!confirm('Выйти из аккаунта?'))return;if(!demo){try{await api('auth',{action:'logout'})}catch{toast('Не удалось выйти на сервере. Попробуй ещё раз.');return}}user=null;run=null;chat=[];closeChat();demo=false;render()};
window.addEventListener('hashchange',()=>{if(run&&location.hash!=='#play'){if(confirm('Покинуть незавершённый разбор?'))run=null;else{location.hash='play';return}}render()});
let lastOriginal='';window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==document.querySelector('iframe')?.contentWindow||e.data?.type!=='delivery-result')return;const payload=e.data.payload;const sig=JSON.stringify(payload.final);if(sig===lastOriginal)return;lastOriginal=sig;write('zico.original.'+(user?.id||'guest'),payload);toast('Ответ исходного модуля сохранён в этом браузере. SVG можно скачать внутри модуля.');});
async function init(){try{const d=await api('auth');cloudReady=d.ready;user=d.user||null;if(user)loadLocal()}catch{}render()}init();
</script></body></html>
